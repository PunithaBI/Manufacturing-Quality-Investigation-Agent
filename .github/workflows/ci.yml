name: Manufacturing Quality Investigation Agent CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall app deployment evaluation

      - name: Ruff lint
        run: ruff check app deployment evaluation

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run security checks
        run: |
          python -m pytest tests/security -q

  evaluation:
    name: Investigation Evaluation
    runs-on: ubuntu-latest
    needs: quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run evaluation
        run: python -m evaluation.run_evaluation

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
      - evaluation

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: manufacturing-quality-investigation-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
      - evaluation
      - docker

    if: always()

    steps:

      - name: Check CI results
        run: |
          echo "========================================"
          echo "MQI CI SUMMARY"
          echo "========================================"
          echo ""

          echo "Quality:    ${{ needs.quality.result }}"
          echo "Security:   ${{ needs.security.result }}"
          echo "Evaluation: ${{ needs.evaluation.result }}"
          echo "Docker:     ${{ needs.docker.result }}"
          echo ""

          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "CI FAILED: quality job failed."
            exit 1
          fi

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "CI FAILED: security job failed."
            exit 1
          fi

          if [ "${{ needs.evaluation.result }}" != "success" ]; then
            echo "CI FAILED: evaluation job failed."
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "CI FAILED: Docker build failed."
            exit 1
          fi

          echo "========================================"
          echo "MQI CI PASS"
          echo "========================================"